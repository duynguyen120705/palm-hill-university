" font-family="Times New Roman, serif" text-anchor="start" fill="#000">Giới tính (*):</text><rect x="480" y="219" width="12" height="12" fill="#fff" stroke="#000" stroke-width="1"/><text xml:space="preserve" x="498" y="230" font-size="14" font-family="Times New Roman, serif" text-anchor="start" fill="#000">Nam</text><rect x="550" y="219" width="12" height="12" fill="#fff" stroke="#000" stroke-width="1"/><text xml:space="preserve" x="568" y="230" font-size="14" font-family="Times New Roman, serif" text-anchor="start" fill="#000">Nữ</text><rect x="610" y="219" width="12" height="12" fill="#fff" stroke="#000" stroke-width="1"/><text xml:space="preserve" x="628" y="230" font-size="14" font-family="Times New Roman, serif" text-anchor="start" fill="#000">Khác</text><text xml:space="preserve" x="40" y="270" font-size="14" font-family="Times New Roman, serif" text-anchor="start" fill="#000" font-weight="bold">II. THÔNG TIN HỌC TẬP</text><text xml:space="preserve" x="60" y="300" font-size="14" font-family="Times New Roman, serif" text-anchor="start" fill="#000">Lớp hành chính (*):</text><line x1="199" y1="302" x2="330" y2="302" stroke="#000" stroke-width="1" stroke-dasharray="1.5,3"/><text xml:space="preserve" x="345" y="300" font-size="14" font-family="Times New Roman, serif" text-anchor="start" fill="#000">Khoa:</text><line x1="386" y1="302" x2="560" y2="302" stroke="#000" stroke-width="1" stroke-dasharray="1.5,3"/><text xml:space="preserve" x="575" y="300" font-size="14" font-family="Times New Roman, serif" text-anchor="start" fill="#000">Khóa:</text><line x1="616" y1="302" x2="700" y2="302" stroke="#000" stroke-width="1" stroke-dasharray="1.5,3"/><text xml:space="preserve" x="60" y="330" font-size="14" font-family="Times New Roman, serif" text-anchor="start" fill="#000">Trạng thái:</text><rect x="150" y="319" width="12" height="12" fill="#fff" stroke="#000" stroke-width="1"/><path d="M152,325 L155,329 L160,321" fill="none" stroke="#000" stroke-width="1.6"/><text xml:space="preserve" x="168" y="330" font-size="14" font-family="Times New Roman, serif" text-anchor="start" fill="#000">Đang học</text><rect x="260" y="319" width="12" height="12" fill="#fff" stroke="#000" stroke-width="1"/><text xml:space="preserve" x="278" y="330" font-size="14" font-family="Times New Roman, serif" text-anchor="start" fill="#000">Bảo lưu</text><rect x="360" y="319" width="12" height="12" fill="#fff" stroke="#000" stroke-width="1"/><text xml:space="preserve" x="378" y="330" font-size="14" font-family="Times New Roman, serif" text-anchor="start" fill="#000">Đã tốt nghiệp</text><rect x="490" y="319" width="12" height="12" fill="#fff" stroke="#000" stroke-width="1"/><text xml:space="preserve" x="508" y="330" font-size="14" font-family="Times New Roman, serif" text-anchor="start" fill="#000">Thôi học</text><text xml:space="preserve" x="40" y="370" font-size="14" font-family="Times New Roman, serif" text-anchor="start" fill="#000" font-weight="bold">III. THÔNG TIN LIÊN HỆ</text><text xml:space="preserve" x="60" y="400" font-size="14" font-family="Times New Roman, serif" text-anchor="start" fill="#000">Số điện thoại:</text><line x1="164" y1="402" x2="330" y2="402" stroke="#000" stroke-width="1" stroke-dasharray="1.5,3"/><text xml:space="preserve" x="345" y="400" font-size="14" font-family="Times New Roman, serif" text-anchor="start" fill="#000">Email:</text><line x1="393" y1="402" x2="700" y2="402" stroke="#000" stroke-width="1" stroke-dasharray="1.5,3"/><text xml:space="preserve" x="60" y="430" font-size="14" font-family="Times New Roman, serif" text-anchor="start" fill="#000">Địa chỉ:</text><line x1="122" y1="432" x2="700" y2="432" stroke="#000" stroke-width="1" stroke-dasharray="1.5,3"/><text xml:space="preserve" x="40" y="470" font-size="14" font-family="Times New Roman, serif" text-anchor="start" fill="#000" font-weight="bold">IV. TÀI KHOẢN ĐĂNG NHẬP</text><text xml:space="preserve" x="60" y="500" font-size="14" font-family="Times New Roman, serif" text-anchor="start" fill="#000">Tên đăng nhập: trùng với Mã sinh viên</text><text xml:space="preserve" x="60" y="530" font-size="14" font-family="Times New Roman, serif" text-anchor="start" fill="#000">Mật khẩu ban đầu (*):</text><line x1="213" y1="532" x2="400" y2="532" stroke="#000" stroke-width="1" stroke-dasharray="1.5,3"/><text xml:space="preserve" x="406" y="530" font-size="12" font-family="Times New Roman, serif" text-anchor="start" fill="#000" font-style="italic">tối thiểu 8 ký tự, gồm chữ và số</text><text xml:space="preserve" x="40" y="564" font-size="12" font-family="Times New Roman, serif" text-anchor="start" fill="#000" font-style="italic">(*) Trường bắt buộc. Lớp chọn từ danh mục; Khoa và Khóa xác định theo lớp.</text><text xml:space="preserve" x="560" y="614" font-size="13" font-family="Times New Roman, serif" text-anchor="middle" fill="#000" font-style="italic">Hà Nội, ngày ..... tháng ..... năm 20.....</text><text xml:space="preserve" x="560" y="640" font-size="14" font-family="Times New Roman, serif" text-anchor="middle" fill="#000" font-weight="bold">NGƯỜI LẬP PHIẾU</text><text xml:space="preserve" x="560" y="658" font-size="12" font-family="Times New Roman, serif" text-anchor="middle" fill="#000" font-style="italic">(Ký, ghi rõ họ tên)</text></svg>
