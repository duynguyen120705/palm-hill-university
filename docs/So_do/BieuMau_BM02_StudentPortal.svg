" text-anchor="start" fill="#000"></text><text xml:space="preserve" x="420" y="177" font-size="12" font-family="Times New Roman, serif" text-anchor="start" fill="#000"></text><text xml:space="preserve" x="492" y="177" font-size="12" font-family="Times New Roman, serif" text-anchor="start" fill="#000"></text><text xml:space="preserve" x="584" y="177" font-size="12" font-family="Times New Roman, serif" text-anchor="start" fill="#000"></text><text xml:space="preserve" x="734" y="177" font-size="12" font-family="Times New Roman, serif" text-anchor="start" fill="#000"></text><text xml:space="preserve" x="818" y="177" font-size="12" font-family="Times New Roman, serif" text-anchor="start" fill="#000"></text><text xml:space="preserve" x="910" y="177" font-size="12" font-family="Times New Roman, serif" text-anchor="start" fill="#000"></text><rect x="54" y="64" width="962" height="24" fill="none" stroke="#000" stroke-width="2"/><path d="M20,184 L20,210 L120,210 L130,184" fill="#fff" stroke="#000" stroke-width="1.2"/><text xml:space="preserve" x="70" y="202" font-size="12" font-family="Times New Roman, serif" text-anchor="middle" fill="#000" font-weight="bold">DanhSach</text><text xml:space="preserve" x="20" y="244" font-size="13" font-family="Times New Roman, serif" text-anchor="start" fill="#000" font-weight="bold">Dòng 1:</text><text xml:space="preserve" x="130" y="244" font-size="13" font-family="Times New Roman, serif" text-anchor="start" fill="#000">tiêu đề cột, giữ đúng tên và thứ tự A → J; dữ liệu bắt đầu từ dòng 2; chỉ đọc sheet đầu tiên.</text><text xml:space="preserve" x="20" y="266" font-size="13" font-family="Times New Roman, serif" text-anchor="start" fill="#000" font-weight="bold">MaSV:</text><text xml:space="preserve" x="130" y="266" font-size="13" font-family="Times New Roman, serif" text-anchor="start" fill="#000">đã tồn tại → cập nhật hồ sơ; chưa tồn tại → thêm mới hồ sơ và tài khoản.</text><text xml:space="preserve" x="20" y="288" font-size="13" font-family="Times New Roman, serif" text-anchor="start" fill="#000" font-weight="bold">NgaySinh:</text><text xml:space="preserve" x="130" y="288" font-size="13" font-family="Times New Roman, serif" text-anchor="start" fill="#000">ô kiểu ngày hoặc chuỗi dd/MM/yyyy.     GioiTinh: Nam | Nữ | Khác.     MaLop: lớp đang sử dụng, thuộc phạm vi người nhập.</text><text xml:space="preserve" x="20" y="310" font-size="13" font-family="Times New Roman, serif" text-anchor="start" fill="#000" font-weight="bold">TrangThai:</text><text xml:space="preserve" x="130" y="310" font-size="13" font-family="Times New Roman, serif" text-anchor="start" fill="#000">Đang học | Bảo lưu | Đã tốt nghiệp | Thôi học.     SDT, Email, DiaChi: có thể để trống.</text><text xml:space="preserve" x="20" y="332" font-size="13" font-family="Times New Roman, serif" text-anchor="start" fill="#000" font-weight="bold">MatKhauBanDau:</text><text xml:space="preserve" x="130" y="332" font-size="13" font-family="Times New Roman, serif" text-anchor="start" fill="#000">bắt buộc với dòng thêm mới; bỏ qua với dòng cập nhật.     Dung lượng file tối đa 5 MB.</text></svg>
