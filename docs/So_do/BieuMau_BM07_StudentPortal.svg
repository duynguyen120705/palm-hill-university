 New Roman, serif" text-anchor="middle" fill="#000" font-weight="bold">Lớp</text><text xml:space="preserve" x="366" y="366" font-size="12" font-family="Times New Roman, serif" text-anchor="middle" fill="#000" font-weight="bold">hiện tại</text><line x1="328" y1="336" x2="328" y2="450" stroke="#000" stroke-width="1"/><text xml:space="preserve" x="454" y="352" font-size="12" font-family="Times New Roman, serif" text-anchor="middle" fill="#000" font-weight="bold">Loại</text><text xml:space="preserve" x="454" y="366" font-size="12" font-family="Times New Roman, serif" text-anchor="middle" fill="#000" font-weight="bold">biến động</text><line x1="404" y1="336" x2="404" y2="450" stroke="#000" stroke-width="1"/><text xml:space="preserve" x="540" y="359" font-size="12" font-family="Times New Roman, serif" text-anchor="middle" fill="#000" font-weight="bold">Lớp đích</text><line x1="504" y1="336" x2="504" y2="450" stroke="#000" stroke-width="1"/><text xml:space="preserve" x="658" y="359" font-size="12" font-family="Times New Roman, serif" text-anchor="middle" fill="#000" font-weight="bold">Lý do</text><line x1="576" y1="336" x2="576" y2="450" stroke="#000" stroke-width="1"/><line x1="60" y1="372" x2="740" y2="372" stroke="#000" stroke-width="1.2"/><text xml:space="preserve" x="80" y="390" font-size="12" font-family="Times New Roman, serif" text-anchor="middle" fill="#000">1</text><text xml:space="preserve" x="106" y="390" font-size="12" font-family="Times New Roman, serif" text-anchor="start" fill="#000">2310020003</text><text xml:space="preserve" x="198" y="390" font-size="12" font-family="Times New Roman, serif" text-anchor="start" fill="#000">Lê Minh Châu</text><text xml:space="preserve" x="334" y="390" font-size="12" font-family="Times New Roman, serif" text-anchor="start" fill="#000">2310A02</text><text xml:space="preserve" x="410" y="390" font-size="12" font-family="Times New Roman, serif" text-anchor="start" fill="#000">Bảo lưu</text><text xml:space="preserve" x="510" y=