yle="italic">…</text><text xml:space="preserve" x="410" y="442" font-size="12" font-family="Times New Roman, serif" text-anchor="start" fill="#000" font-style="italic">…</text><text xml:space="preserve" x="510" y="442" font-size="12" font-family="Times New Roman, serif" text-anchor="start" fill="#000" font-style="italic">…</text><text xml:space="preserve" x="582" y="442" font-size="12" font-family="Times New Roman, serif" text-anchor="start" fill="#000" font-style="italic">…</text><text xml:space="preserve" x="60" y="480" font-size="13" font-family="Times New Roman, serif" text-anchor="start" fill="#000" font-weight="bold">Điều 2. </text><text xml:space="preserve" x="118" y="480" font-size="13" font-family="Times New Roman, serif" text-anchor="start" fill="#000">Quyết định có hiệu lực kể từ ngày ký.</text><text xml:space="preserve" x="60" y="502" font-size="13" font-family="Times New Roman, serif" text-anchor="start" fill="#000" font-weight="bold">Điều 3. </text><text xml:space="preserve" x="118" y="502" font-size="13" font-family="Times New Roman, serif" text-anchor="start" fill="#000">Phòng Công tác sinh viên, Khoa và các sinh viên có tên tại Điều 1 chịu trách nhiệm thi hành.</text><text xml:space="preserve" x="600" y="548" font-size="14" font-family="Times New Roman, serif" text-anchor="middle" fill="#000" font-weight="bold">HIỆU TRƯỞNG</text><text xml:space="preserve" x="600" y="566" font-size="12" font-family="Times New Roman, serif" text-anchor="middle" fill="#000" font-style="italic">(Ký, đóng dấu)</text><text xml:space="preserve" x="60" y="548" font-size="12" font-family="Times New Roman, serif" text-anchor="start" fill="#000" font-weight="bold" font-style="italic">Nơi nhận:</text><text xml:space="preserve" x="60" y="566" font-size="12" font-family="Times New Roman, serif" text-anchor="start" fill="#000">- Như Điều 3;</text><text xml:space="preserve" x="60" y="582" font-size="12" font-family="Times New Roman, serif" text-anchor="start" fill="#000">- Lưu: VT,